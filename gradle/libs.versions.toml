# gradle/libs.versions.toml

[versions]
agp = "8.11.1"             # Versi Android Gradle Plugin yang valid dan stabil
kotlin = "2.0.0"          # Versi Kotlin yang stabil (2.0.21 bukan rilis resmi)
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
material = "1.12.0"
constraintlayout = "2.1.4" # Versi ConstraintLayout yang stabil
lifecycle = "2.8.3"      # Versi terbaru untuk Lifecycle components
navigation = "2.7.7"     # Versi terbaru untuk Navigation components
okhttp = "4.12.0"        # Versi OkHttp yang stabil (hapus 'okhttpVersion' yang konflik)
retrofit = "2.9.0"
gson = "2.9.0"           # Versi spesifik untuk library Gson, jika diperlukan
androidx-recyclerview = "1.3.2"
glide = "4.16.0"
androidx-cardview = "1.0.0" # Tambahkan ini jika belum ada dan Anda pakai CardView
androidx-fragment-ktx = "1.7.1" # Untuk by viewModels() di fragment
androidx-activity-ktx = "1.9.0" # Untuk by viewModels() di activity

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" } # Penting juga
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
androidx-cardview = { group = "androidx.cardview", name = "cardview", version.ref = "androidx-cardview" } # Tambahkan ini

# Kotlin extensions for delegates (by viewModels())
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidx-fragment-ktx" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity-ktx" }

# Networking
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" } # Version converter-gson ikut retrofit
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" } # Ini untuk OkHttp library itu sendiri

# Image Loading
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" } # Untuk KAPT

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Jika Anda menggunakan plugin lain seperti Safe Args atau KAPT, definisikan di sini juga:
# safe-args-kotlin = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" } # Ini tidak perlu 'apply false' di project level jika di app level juga ada
# kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" } # Atau versi kapt spesifik, jika tidak pakai plugins {} di build.gradle

[bundles]
android-essential = [
    "androidx-core-ktx",
    "androidx-appcompat",
    "material",
    "androidx-constraintlayout",
    "androidx-lifecycle-livedata-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-runtime-ktx",
    "androidx-navigation-fragment-ktx",
    "androidx-navigation-ui-ktx",
    "androidx-recyclerview",
    "androidx-cardview",
    "androidx-fragment-ktx",
    "androidx-activity-ktx",
    "glide", # Termasuk Glide di essential bundle
]
networking = [
    "retrofit",
    "converter-gson",
    "okhttp" # KONSISTEN: Ini mereferensikan alias 'okhttp' dari [libraries]
]